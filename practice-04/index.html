<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ПР4 — Задачи с формой и localStorage</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Практическая работа № 4</h1>
    <nav class="dataset-switch">
      <a href="./index.html">Общий набор</a>
      <a href="./index.html?dataset=variant">Свой вариант</a>
    </nav>
  </header>

  <main>
    <section class="summary" id="task-summary">
      <div class="summary-item"><span class="summary-label">Всего:</span> <span data-stat="total">0</span></div>
      <div class="summary-item"><span class="summary-label">Выполнено:</span> <span data-stat="completed">0</span></div>
      <div class="summary-item"><span class="summary-label">Осталось:</span> <span data-stat="pending">0</span></div>
      <div class="summary-item"><span class="summary-label">Прогресс:</span> <span data-stat="progress">0.0%</span></div>
      <div class="summary-item"><span class="summary-label">Показано:</span> <span data-stat="visible">0</span></div>
    </section>

    <section class="form-section">
      <h2 id="form-title">Добавление задачи</h2>
      <form id="task-form" novalidate>
        <div class="form-row">
          <label for="task-id">ID</label>
          <input id="task-id" name="id" type="number" min="1" step="1" required>
          <span class="field-error" data-error-for="id"></span>
        </div>
        <div class="form-row">
          <label for="task-title">Название</label>
          <input id="task-title" name="title" type="text" maxlength="100" required>
          <span class="field-error" data-error-for="title"></span>
        </div>
        <div class="form-row">
          <label for="task-priority">Приоритет</label>
          <select id="task-priority" name="priority" required>
            <option value="low">Низкий</option>
            <option value="medium" selected>Средний</option>
            <option value="high">Высокий</option>
          </select>
          <span class="field-error" data-error-for="priority"></span>
        </div>
        <div class="form-actions">
          <button type="submit" id="form-submit">Добавить задачу</button>
          <button type="button" id="form-cancel" hidden>Отменить</button>
          <button type="button" id="form-reset-storage">Сбросить сохранённые данные</button>
        </div>
      </form>
      <p id="form-message" class="form-message" role="status"></p>
    </section>

    <section class="toolbar">
      <div id="task-filters" class="filters" role="group" aria-label="Фильтр по статусу">
        <button type="button" data-filter="all" class="is-active" aria-pressed="true">Все</button>
        <button type="button" data-filter="pending" aria-pressed="false">В работе</button>
        <button type="button" data-filter="completed" aria-pressed="false">Выполненные</button>
      </div>
    </section>

    <p id="operation-message" class="operation-message" role="status"></p>
    <p id="empty-state" class="empty-state" hidden></p>

    <ul id="task-list" class="task-list"></ul>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
