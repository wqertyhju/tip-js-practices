<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>ПР6 — Задачи (API)</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Практическая работа № 6</h1>
    <div id="api-status">API: ...</div>
  </header>

  <main>
    <section class="form-section">
      <h2 id="form-title">Добавление задачи</h2>
      <form id="task-form" novalidate>
        <div class="form-row">
          <label>Название</label>
          <input id="task-title" name="title" type="text" maxlength="100" required>
        </div>
        <div class="form-row">
          <label>Приоритет</label>
          <select id="task-priority" name="priority">
            <option value="low">Низкий</option>
            <option value="medium" selected>Средний</option>
            <option value="high">Высокий</option>
          </select>
        </div>
        <div class="form-row">
          <label>Категория</label>
          <select id="task-category" name="categoryId" required></select>
        </div>
        <div class="form-actions">
          <button type="submit" id="form-submit">Сохранить</button>
          <button type="button" id="form-reset">Сбросить данные на сервере</button>
        </div>
      </form>
      <p id="operation-message" class="form-message" role="status"></p>
    </section>

    <section class="toolbar">
      <div id="task-filters" class="filters">
        <button type="button" data-filter="all" class="is-active">Все</button>
        <button type="button" data-filter="pending">В работе</button>
        <button type="button" data-filter="completed">Выполненные</button>
        <select id="filter-category" class="filter-select"></select>
      </div>
    </section>

    <div id="task-summary" class="summary"></div>
    <p id="empty-state" class="empty-state" hidden></p>
    <ul id="task-list" class="task-list"></ul>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
